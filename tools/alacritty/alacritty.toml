[font]
normal = { family = "JetBrains Mono", style = "Regular" }
size = 10.0

[cursor]
style = { shape = "Block" }

[bell]
duration = 0
command = "None"

[colors]
# bold-color-same-as-fg=true
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#0f0f0f"
foreground = "#e8e8d3"

[colors.normal]
black   = "#3b3b3b"
red     = "#cf6a4c"
green   = "#99ad6a"
yellow  = "#d8ad4c"
blue    = "#597bc5"
magenta = "#a037b0"
cyan    = "#71b9f8"
white   = "#adadad"

[colors.bright]
black   = "#3b3b3b"
red     = "#da7557"
green   = "#b4c58c"
yellow  = "#e7b950"
blue    = "#6185d2"
magenta = "#b33ec5"
cyan    = "#80c2fc"
white   = "#bbbbbb"
